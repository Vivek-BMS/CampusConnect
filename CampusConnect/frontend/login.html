<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – CampusConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; background: #F5F7FA;">

  <!-- Nav Header -->
  <nav class="public-nav">
    <div class="public-nav-container">
      <a href="index.html" class="nav-brand">
        <div class="brand-icon">🎓</div>
        <span>CampusConnect</span>
      </a>
      <div class="nav-actions">
        <button class="lang-toggle lang-toggle-btn">
          🌐 <span class="lang-label">ಕನ್ನಡ</span>
        </button>
        <a href="register.html" class="btn btn-outline">Create Account</a>
      </div>
    </div>
  </nav>

  <!-- Login Main Container -->
  <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="card auth-box" style="max-width: 460px; width: 100%; padding: 36px; border-radius: 16px;">
      
      <div style="text-align: center; margin-bottom: 28px;">
        <div style="width: 48px; height: 48px; background: #EFF6FF; color: #3B82F6; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 12px;">
          🔑
        </div>
        <h2 style="color: #142B4A; font-size: 1.6rem; font-weight: 800;">Welcome Back</h2>
        <p style="color: #64748B; font-size: 0.9rem; margin-top: 4px;">Sign in to your campus account to manage reports & claims</p>
      </div>

      <!-- Quick Fill Helper Buttons for Demo -->
      <div style="background: #F8FAFC; border: 1px dashed #CBD5E1; border-radius: 8px; padding: 12px; margin-bottom: 20px;">
        <div style="font-size: 0.75rem; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 8px; text-align: center;">
          ⚡ 1-Click Demo Accounts (Portfolio Testing)
        </div>
        <div style="display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;">
          <button type="button" class="btn btn-sm btn-outline" data-demo-login="student" style="font-size: 0.75rem;">
            👤 Student
          </button>
          <button type="button" class="btn btn-sm btn-outline" data-demo-login="admin" style="font-size: 0.75rem;">
            🛡️ Admin
          </button>
          <button type="button" class="btn btn-sm btn-outline" data-demo-login="security" style="font-size: 0.75rem;">
            👮 Security
          </button>
        </div>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">College Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="name@campus.edu" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password</label>
            <a href="#" onclick="alert('Default demo password is Student@123 or Admin@123')" style="font-size: 0.8rem;">Forgot password?</a>
          </div>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid #F1F5F9; font-size: 0.9rem; color: #64748B;">
        Don't have an account? <a href="register.html" style="font-weight: 600;">Register as Student</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

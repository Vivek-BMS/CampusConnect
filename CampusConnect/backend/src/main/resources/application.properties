# ===================================================================
# CampusConnect Application Configuration (Production / MySQL)
# ===================================================================

spring.application.name=CampusConnect

server.port=8080
server.servlet.context-path=/

# -------------------------------------------------------------------
# Database Configuration - MySQL
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/campusconnect_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# File Upload Configuration
# -------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# -------------------------------------------------------------------
# JWT Security Configuration
# -------------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351655468576D5A7134743777217A25432A
app.jwt.expiration-ms=86400000

# -------------------------------------------------------------------
# Smart Matching Algorithm Configurable Weights (Sum = 100.0)
# -------------------------------------------------------------------
app.matching.weight.category=20.0
app.matching.weight.title=25.0
app.matching.weight.color=15.0
app.matching.weight.brand=10.0
app.matching.weight.location=15.0
app.matching.weight.date=10.0
app.matching.weight.description=5.0
app.matching.threshold=50.0

# -------------------------------------------------------------------
# CORS Configuration
# -------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://localhost:8080,http://127.0.0.1:5500,http://127.0.0.1:3000,http://127.0.0.1:8080
